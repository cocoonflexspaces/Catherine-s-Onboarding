<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catherine's Onboarding — Cocoon Flex Spaces</title>
<style>
  :root{
    --bg:#F5F2E8;
    --bg-deep:#ECE7D6;
    --surface:#FFFFFF;
    --ink:#1A1A1A;
    --ink-soft:#4A4A4A;
    --accent:#F54029;
    --accent-ink:#B22E1B;
    --teal:#275453;
    --teal-ink:#F5F2E8;
    --rule:rgba(26,26,26,0.12);
    --radius:8px;
    --chip-tba-bg:rgba(245,64,41,0.12);
    --chip-tba-ink:#B22E1B;
    --chip-shared-bg:rgba(39,84,83,0.12);
    --chip-shared-ink:#1B3E3D;
    --chip-active-bg:rgba(39,110,80,0.14);
    --chip-active-ink:#1F6B4A;
    color-scheme:light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#171916;
      --bg-deep:#20221E;
      --surface:#211F1B;
      --ink:#F5F2E8;
      --ink-soft:rgba(245,242,232,0.64);
      --accent:#FF6B4E;
      --accent-ink:#FFB39F;
      --teal:#1E3E3D;
      --teal-ink:#F5F2E8;
      --rule:rgba(245,242,232,0.14);
      --chip-tba-bg:rgba(255,107,78,0.18);
      --chip-tba-ink:#FFB39F;
      --chip-shared-bg:rgba(76,140,137,0.22);
      --chip-shared-ink:#9FD6D2;
      --chip-active-bg:rgba(63,168,120,0.2);
      --chip-active-ink:#8FE0B4;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#171916;
    --bg-deep:#20221E;
    --surface:#211F1B;
    --ink:#F5F2E8;
    --ink-soft:rgba(245,242,232,0.64);
    --accent:#FF6B4E;
    --accent-ink:#FFB39F;
    --teal:#1E3E3D;
    --teal-ink:#F5F2E8;
    --rule:rgba(245,242,232,0.14);
    --chip-tba-bg:rgba(255,107,78,0.18);
    --chip-tba-ink:#FFB39F;
    --chip-shared-bg:rgba(76,140,137,0.22);
    --chip-shared-ink:#9FD6D2;
    --chip-active-bg:rgba(63,168,120,0.2);
    --chip-active-ink:#8FE0B4;
    color-scheme:dark;
  }

  *,*::before,*::after{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{ padding-bottom:64px; }

  .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .eyebrow--on-teal{ color:rgba(245,242,232,0.6); }
  .hero__mark{ margin-bottom:14px; opacity:0.92; }

  .about-copy p{
    font-size:14px;
    line-height:1.7;
    color:var(--ink-soft);
    max-width:640px;
    margin:0 0 14px;
  }
  .about-copy p:first-child{ color:var(--ink); font-weight:600; }

  /* ── HERO / STATUS BAR ───────────────────────────── */
  .hero{
    background:var(--teal);
    color:var(--teal-ink);
    padding:40px 40px 32px;
  }
  .hero__inner{ max-width:920px; margin:0 auto; }
  .hero__title{
    margin:10px 0 6px;
    font-size:clamp(26px,4vw,38px);
    font-weight:800;
    letter-spacing:-0.02em;
    text-wrap:balance;
  }
  .hero__sub{
    margin:0 0 26px;
    font-size:14px;
    color:rgba(245,242,232,0.72);
    max-width:520px;
    line-height:1.55;
  }
  .hero__meta{
    display:flex;
    flex-wrap:wrap;
    gap:28px;
    align-items:flex-end;
    padding-top:20px;
    border-top:1px solid rgba(245,242,232,0.16);
  }
  .meta-field label{
    display:block;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:rgba(245,242,232,0.5);
    margin-bottom:6px;
  }
  .meta-field input{
    background:transparent;
    border:none;
    border-bottom:1px solid rgba(245,242,232,0.35);
    color:var(--teal-ink);
    font-size:14px;
    font-family:inherit;
    font-weight:600;
    padding:2px 0 4px;
    width:170px;
  }
  .meta-field input::placeholder{ color:rgba(245,242,232,0.4); }
  .meta-field input:focus{ outline:none; border-bottom-color:var(--accent); }

  .progress-block{ flex:1 1 220px; min-width:200px; }
  .progress-block__label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.04em;
    color:rgba(245,242,232,0.7);
    margin-bottom:8px;
  }
  .progress-track{
    height:8px;
    border-radius:100px;
    background:rgba(245,242,232,0.18);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:100px;
    background:var(--accent);
    transition:width .35s ease;
  }

  /* ── SECTIONS ─────────────────────────────────────── */
  .section{
    max-width:920px;
    margin:0 auto;
    padding:40px 40px 0;
  }
  .section__head{ margin-bottom:18px; }
  .section__title{
    margin:8px 0 0;
    font-size:20px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    overflow:hidden;
  }

  .check-item{
    display:flex;
    gap:14px;
    align-items:flex-start;
    padding:16px 20px;
    border-bottom:1px solid var(--rule);
    cursor:pointer;
  }
  .check-item:last-child{ border-bottom:none; }
  .check-item input[type="checkbox"]{
    appearance:none;
    -webkit-appearance:none;
    width:18px; height:18px;
    margin-top:2px;
    flex:none;
    border:1.5px solid var(--ink-soft);
    border-radius:4px;
    background:transparent;
    cursor:pointer;
    position:relative;
  }
  .check-item input[type="checkbox"]:checked{
    background:var(--accent);
    border-color:var(--accent);
  }
  .check-item input[type="checkbox"]:checked::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(40deg);
  }
  .check-item__text{ font-size:14px; line-height:1.55; }
  .check-item__text b{ font-weight:700; }
  .check-item.is-done .check-item__text{ color:var(--ink-soft); }
  .check-item.is-done .check-item__text b{ text-decoration:line-through; text-decoration-color:var(--rule); }

  /* ── CREDENTIALS ──────────────────────────────────── */
  .cred-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
  }
  .cred-card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .cred-card__top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .cred-card__name{ font-size:14px; font-weight:800; }
  .chip{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    padding:4px 10px;
    border-radius:100px;
    border:none;
    cursor:pointer;
    font-family:inherit;
  }
  .chip--tba{ background:var(--chip-tba-bg); color:var(--chip-tba-ink); }
  .chip--shared{ background:var(--chip-shared-bg); color:var(--chip-shared-ink); }
  .chip--active{ background:var(--chip-active-bg); color:var(--chip-active-ink); }
  .cred-field{ margin-bottom:8px; }
  .cred-field:last-child{ margin-bottom:0; }
  .cred-field label{
    display:block;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .cred-field input{
    width:100%;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:var(--bg-deep);
    border:1px solid var(--rule);
    border-radius:6px;
    padding:8px 10px;
  }
  .cred-field input:focus{ outline:none; border-color:var(--accent); }
  .cred-hint{
    font-size:12px;
    color:var(--ink-soft);
    margin:-6px 0 18px;
  }

  /* ── NOTES / FOOTER BAR ───────────────────────────── */
  /* ── ROLE OVERVIEW ────────────────────────────────── */
  .role-list{
    list-style:none;
    margin:0 0 24px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .role-list li{
    display:flex;
    gap:12px;
    align-items:flex-start;
    font-size:14px;
    line-height:1.55;
  }
  .role-list li::before{
    content:"";
    flex:none;
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    margin-top:8px;
  }
  .role-list li.is-extra{ color:var(--ink-soft); }
  .role-list li.is-extra::after{
    content:"suggested — adjust freely";
    font-size:10px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--accent);
    align-self:center;
    white-space:nowrap;
  }
  .stat-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .stat-tile{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-tile__label{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .stat-tile__value{
    font-size:18px;
    font-weight:800;
    margin-bottom:2px;
  }
  .stat-tile__sub{ font-size:12px; color:var(--ink-soft); }
  .resource-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    border-bottom:1px solid var(--accent);
    padding-bottom:1px;
  }

  /* ── TEAM & PARTNERS ──────────────────────────────── */
  .people-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:12px;
  }
  .people-card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  .people-card__avatar{
    width:48px; height:48px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin-bottom:10px;
    border:1px solid var(--rule);
  }
  .people-card__name{ font-size:14px; font-weight:800; }
  .people-card__role{ font-size:12px; color:var(--ink-soft); margin:2px 0 8px; }
  .people-card__email{
    font-size:12px;
    color:var(--ink);
    background:var(--bg-deep);
    border-radius:6px;
    padding:6px 8px;
    word-break:break-all;
  }
  .partner-card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:16px 18px;
    margin-bottom:12px;
  }
  .partner-card__name{ font-size:14px; font-weight:800; margin-bottom:2px; }
  .partner-card__tag{ font-size:11px; color:var(--ink-soft); margin-bottom:12px; }
  .partner-card__row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    padding:6px 0;
    border-top:1px solid var(--rule);
  }
  .partner-card__row:first-of-type{ border-top:none; }
  .partner-card__row b{ font-weight:700; }
  .partner-card__row span{ color:var(--ink-soft); text-align:right; }

  .notes-section{ margin-top:40px; }
  .notes-card{
    background:var(--surface);
    border:1px solid var(--rule);
    border-radius:var(--radius);
    padding:18px 20px;
  }
  .notes-card textarea{
    width:100%;
    min-height:64px;
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:transparent;
    border:none;
    resize:vertical;
    line-height:1.5;
  }
  .notes-card textarea:focus{ outline:none; }

  .cta-bar{
    background:var(--accent);
    margin-top:40px;
    padding:22px 40px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .cta-bar span{
    font-size:12px;
    font-weight:600;
    color:#fff;
    opacity:.92;
  }
  .readonly-badge{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:#fff;
    background:rgba(0,0,0,0.18);
    padding:6px 12px;
    border-radius:100px;
  }

  input:disabled, textarea:disabled, .chip:disabled{
    opacity:.6;
    cursor:default;
  }

  @media (max-width:640px){
    .hero,.section,.cta-bar{ padding-left:20px; padding-right:20px; }
    .hero__meta{ gap:20px; }
    .meta-field input{ width:130px; }
  }
</style>
</head>

  var ABOUT_PARAGRAPHS = [
    "We're so excited to have you join our team! And we can't wait to get started!",
    "We are a real estate management and events services company committed to supporting our clients and our community through human-centric ideas and services.",
    "We manage a portfolio of unique locations by partnering with property owners who want to monetize their underutilized spaces, and we make these spaces available to rental clients for activities like media productions, photoshoots, showrooms, private and corporate events, and more.",

  ];

  var RESPONSIBILITIES = [
    ["Build each month's content calendar in advance across Instagram, TikTok, and LinkedIn.", false],
    ["Keep the content pipeline moving — from ideation through final posting.", false],
    ["Put together monthly reporting on content performance.", false],
    ["Assist with image creation for the website.", false],

    ["Respond to comments and DMs across the social accounts to keep response times healthy.", true],
    ["Coordinate with Casa Managers to plan on-site content shoots.", true]
  ];

  function defaultState(){
    var creds = {};
    CRED_ORDER.forEach(function(k){
      creds[k] = { user:(k==="google" ? "catherine@cocoonflexspaces.com" : "TBA"), pass:"TBA", status:"tba" };
    });
    return {
      owner:"Piero",
      startDate:"",
      checks:{},
      creds:creds,
      notes:"",
      updatedAt:null
    };
  }

  function readInitialState(){
    var el = document.getElementById("state-data");
    if(el){
      try{ return Object.assign(defaultState(), JSON.parse(el.textContent)); }catch(e){}
    }
    return defaultState();
  }

  function esc(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function totalItems(){
    var n=0; CHECKLIST.forEach(function(s){ n+=s.items.length; }); return n;
  }
  function doneItems(state){
    var n=0; CHECKLIST.forEach(function(s){ s.items.forEach(function(it){ if(state.checks[it[0]]) n++; }); }); return n;
  }

  function chipClass(status){
    return status==="active" ? "chip chip--active" : status==="shared" ? "chip chip--shared" : "chip chip--tba";
  }
  function chipLabel(status){
    return status==="active" ? "Active" : status==="shared" ? "Shared" : "TBA";
  }
  function nextStatus(status){
    return status==="tba" ? "shared" : status==="shared" ? "active" : "tba";
  }

  function renderBody(state, readOnly){
    var done = doneItems(state), total = totalItems();
    var pct = total ? Math.round((done/total)*100) : 0;
    var dis = readOnly ? " disabled" : "";

    var sections = CHECKLIST.map(function(sec){
      var rows = sec.items.map(function(it){
        var id = it[0], lead = it[1], rest = it[2];
        var checked = !!state.checks[id];
        return (
          '<label class="check-item'+(checked?' is-done':'')+'" data-check-id="'+id+'">'+
            '<input type="checkbox" data-check-id="'+id+'"'+(checked?' checked':'')+dis+'>'+
            '<span class="check-item__text"><b>'+esc(lead)+'</b> '+esc(rest)+'</span>'+
          '</label>'
        );
      }).join("");
      return (
        '<div class="section">'+
          '<div class="section__head"><div class="eyebrow">'+esc(sec.key==='before'?'Getting ready':sec.key==='day1'?'Day 1':sec.key==='days23'?'Days 2–3':'Days 4–5')+'</div>'+
          '<h2 class="section__title">'+esc(sec.title)+'</h2></div>'+
          '<div class="card">'+rows+'</div>'+
        '</div>'
      );
    }).join("");

    var aboutParagraphs = ABOUT_PARAGRAPHS.map(function(p){ return '<p>'+esc(p)+'</p>'; }).join("");

    var roleItems = RESPONSIBILITIES.map(function(r){
      return '<li'+(r[1]?' class="is-extra"':'')+'>'+esc(r[0])+'</li>';
    }).join("");

    var teamCards = TEAM.map(function(p){
      return (
        '<div class="people-card">'+
          '<img class="people-card__avatar" src="'+p.avatar+'" alt="'+esc(p.name)+'" width="48" height="48">'+
          '<div class="people-card__name">'+esc(p.name)+'</div>'+
          '<div class="people-card__role">'+esc(p.role)+'</div>'+
          '<div class="people-card__email">'+esc(p.email)+'</div>'+
        '</div>'
      );
    }).join("");

    var credCards = CRED_ORDER.map(function(k){
      var c = state.creds[k];
      return (
        '<div class="cred-card">'+
          '<div class="cred-card__top">'+
            '<div class="cred-card__name">'+esc(CRED_LABELS[k])+'</div>'+
            '<button type="button" class="'+chipClass(c.status)+'" data-cred-status="'+k+'"'+dis+'>'+chipLabel(c.status)+'</button>'+
          '</div>'+
          '<div class="cred-field"><label>Login / email</label><input type="text" data-cred="'+k+'" data-field="user" value="'+esc(c.user)+'" placeholder="TBA"'+dis+'></div>'+
          '<div class="cred-field"><label>Password / access notes</label><input type="text" data-cred="'+k+'" data-field="pass" value="'+esc(c.pass)+'" placeholder="TBA"'+dis+'></div>'+
        '</div>'
      );
    }).join("");

    var updated = state.updatedAt ? new Date(state.updatedAt).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}) : "not yet saved";

    return (
      '<div class="hero"><div class="hero__inner">'+
        '<img class="hero__mark" src="'+LOGO_CREAM+'" alt="Cocoon" width="34" height="42">'+
        '<div class="eyebrow eyebrow--on-teal">Cocoon Flex Spaces · Social Media Onboarding</div>'+
        '<h1 class="hero__title">Catherine\u2019s Onboarding</h1>'+
        '<p class="hero__sub">Access, tools, and the people she needs to meet — tick items off as they happen and fill in credentials as they\u2019re ready.</p>'+
        '<div class="hero__meta">'+
          '<div class="progress-block"><div class="progress-block__label"><span>Progress</span><span>'+done+' / '+total+'</span></div>'+
          '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div></div>'+
          '<div class="meta-field"><label>Onboarding owner</label><input type="text" id="owner-input" value="'+esc(state.owner)+'"'+dis+'></div>'+
          '<div class="meta-field"><label>Start date</label><input type="text" id="start-input" placeholder="e.g. Oct 6" value="'+esc(state.startDate)+'"'+dis+'></div>'+
        '</div>'+
      '</div></div>'+

      '<div class="section">'+
        '<div class="section__head"><div class="eyebrow">About Cocoon</div>'+
        '<h2 class="section__title">Welcome to Cocoon, Catherine</h2></div>'+
        '<div class="about-copy">'+aboutParagraphs+
        '<a class="resource-link" href="'+BRAND_GUIDE_URL+'" target="_blank" rel="noopener">Read the brand guide →</a>'+
        '</div>'+
      '</div>'+

      '<div class="section">'+
        '<div class="section__head"><div class="eyebrow">Role overview</div>'+
        '<h2 class="section__title">What Catherine owns</h2></div>'+
        '<ul class="role-list">'+roleItems+'</ul>'+
        '<div class="stat-row">'+
          '<div class="stat-tile"><div class="stat-tile__label">Hours</div>'+
          '<div class="stat-tile__value">4 hrs / day</div>'+
          '<div class="stat-tile__sub">11:00 AM–1:00 PM &amp; 3:00 PM–5:00 PM EST</div></div>'+
          '<div class="stat-tile"><div class="stat-tile__label">Resources</div>'+
          '<div class="stat-tile__value">Brand guidelines</div>'+
          '<a class="resource-link" href="'+BRAND_GUIDE_URL+'" target="_blank" rel="noopener">Open the Drive folder →</a></div>'+
        '</div>'+
      '</div>'+

      sections+

      '<div class="section">'+
        '<div class="section__head"><div class="eyebrow">Team</div>'+
        '<h2 class="section__title">Who’s who at Cocoon</h2></div>'+
        '<div class="people-grid">'+teamCards+'</div>'+
      '</div>'+

      '<div class="section">'+
        '<div class="section__head"><div class="eyebrow">Partners</div>'+
        '<h2 class="section__title">Outside teams you may run into</h2></div>'+
        '<div class="partner-card">'+
          '<div class="partner-card__name">KCG</div>'+
          '<div class="partner-card__tag">Website &amp; SEO agency</div>'+
          '<div class="partner-card__row"><b>Saul</b><span>Owner</span></div>'+
          '<div class="partner-card__row"><b>Abril &amp; Maliha</b><span>Project Managers</span></div>'+
          '<div class="partner-card__row"><b>Mikey</b><span>SEO Specialist &amp; Blog Writer</span></div>'+
        '</div>'+
        '<div class="partner-card">'+
          '<div class="partner-card__name">Ashley VandenEynden</div>'+
          '<div class="partner-card__tag">Acclarity Group — finance &amp; payments direction</div>'+
          '<div class="partner-card__row"><b>Email</b><span>avandeneynden@acclaritygroup.com</span></div>'+
        '</div>'+
      '</div>'+

      '<div class="section notes-section" style="padding-top:0;">'+
        '<div class="section__head"><div class="eyebrow">Access &amp; credentials</div>'+
        '<h2 class="section__title">Tool access for Catherine</h2></div>'+
        '<p class="cred-hint">Everything below defaults to <b>TBA</b> — fill it in as each account is created or shared. Click the status pill to mark it Shared or Active.</p>'+
        '<div class="cred-grid">'+credCards+'</div>'+
      '</div>'+

      '<div class="section notes-section">'+
        '<div class="section__head"><div class="eyebrow">Notes</div>'+
        '<h2 class="section__title">Open questions &amp; owner</h2></div>'+
        '<div class="notes-card"><textarea id="notes-input" placeholder="Anything still unresolved after week one goes here..."'+dis+'>'+esc(state.notes)+'</textarea></div>'+
      '</div>'+

      '<div class="cta-bar"><span>Last saved '+esc(updated)+'</span>'+
      '<span>Saved to this browser only.</span>'+
      '</div>'
    );
  }

  
  var STORAGE_KEY = "cocoon-catherine-onboarding-v1";

  function loadSaved(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return null;
  }

  function saveState(state){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }

  var state = Object.assign(defaultState(), loadSaved() || {});

  function paint(){
    document.getElementById("app").innerHTML = renderBody(state, false);
    wire();
  }

  function persist(){
    state.updatedAt = new Date().toISOString();
    saveState(state);
    paint();
  }

  function wire(){
    var root = document.getElementById("app");

    root.querySelectorAll('input[type="checkbox"][data-check-id]').forEach(function(cb){
      cb.addEventListener("change", function(){
        state.checks[cb.getAttribute("data-check-id")] = cb.checked;
        persist();
      });
    });

    root.querySelectorAll('button[data-cred-status]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var k = btn.getAttribute("data-cred-status");
        state.creds[k].status = nextStatus(state.creds[k].status);
        persist();
      });
    });

    root.querySelectorAll('input[data-cred]').forEach(function(inp){
      inp.addEventListener("change", function(){
        var k = inp.getAttribute("data-cred"), f = inp.getAttribute("data-field");
        state.creds[k][f] = inp.value;
        persist();
      });
    });

    var ownerInput = root.querySelector("#owner-input");
    if(ownerInput) ownerInput.addEventListener("change", function(){ state.owner = ownerInput.value; persist(); });

    var startInput = root.querySelector("#start-input");
    if(startInput) startInput.addEventListener("change", function(){ state.startDate = startInput.value; persist(); });

    var notesInput = root.querySelector("#notes-input");
    if(notesInput) notesInput.addEventListener("change", function(){ state.notes = notesInput.value; persist(); });
  }

  paint();
})();
</script>
</body>
</html>
